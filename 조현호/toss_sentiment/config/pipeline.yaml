# 토스증권 커뮤니티 감성 분석 파이프라인 설정
# 중간보고서 원고(토스증권_감성분석_중간보고서_원고.md)의 설계를 그대로 반영한다.

project:
  name: 토스증권 커뮤니티 감성 분석
  team: 6조
  timezone: Asia/Seoul

# 분석 대상 종목과 기간. 원고 기준 "국내 상장 종목 3~5개 / 연속 약 6개월" 제안.
# 실제 종목과 기간은 수집 가능성 확인 후 팀 협의로 확정한다.
scope:
  stocks:
    - stock_id: "005930"
      name: 삼성전자
    - stock_id: "000660"
      name: SK하이닉스
    - stock_id: "035720"
      name: 카카오
  start_date: "2026-03-02"
  end_date: "2026-08-31"
  market_index: KOSPI

collect:
  # sample      : 합성 표본으로 파이프라인 전체를 점검한다(실데이터 아님).
  # manual_csv  : 팀이 직접 확보한 CSV를 data/raw/posts/ 에 넣어 사용한다.
  source: sample

  # 수집 허용 조건(이용약관·robots·접근 범위)을 확인하기 전에는 자동 수집을 막는다.
  # 원고 02장 "본격 수집 전 이용 조건 확인" 원칙을 코드로 강제하는 장치다.
  collection_approved: false

  sample:
    seed: 20261006
    posts_per_day: 24
    comment_ratio: 0.45

  manual_csv:
    input_dir: data/raw/posts
    # 필수 컬럼: stock_id, post_id, parent_id, text, created_at
    # 선택 컬럼: collected_at, source

clean:
  drop_duplicate_text: true
  # 동일 종목에서 같은 정규화 텍스트가 이 횟수 이상 반복되면 홍보성으로 본다.
  promo_repeat_threshold: 4
  min_chars: 2
  # 종목 관련성 확인에 사용할 최소 토큰 수. 0이면 길이 기준을 적용하지 않는다.
  drop_columns: [author, nickname, profile_url, user_id]

sentiment:
  # lexicon : 주식 은어 사전 기반 기준선(원고 03장 "사전 기반 기준선")
  # model   : 한국어 감성 모델(transformers 설치 시에만 동작)
  method: lexicon
  model_name: snunlp/KR-FinBert-SC
  neutral_band: 0.08
  # 사람이 라벨링한 평가 표본. 있으면 precision/recall/macro-F1과 혼동행렬을 산출한다.
  gold_path: data/labels/gold.csv

market:
  # csv    : data/raw/market/<stock_id>.csv 와 data/raw/market/index.csv 를 읽는다.
  # fdr    : FinanceDataReader 설치 시 자동 수집한다.
  # sample : 합성 시세로 파이프라인을 점검한다(실데이터 아님).
  source: sample
  input_dir: data/raw/market
  price_column: close
  volume_column: volume

aggregate:
  # 집계 구간: 직전 거래일 종가 이후 ~ 당일 종가. 비거래일 글은 다음 거래일에 배정한다.
  market_close: "15:30"
  # 글 수가 이 값 미만인 거래일의 감성 지수는 0이 아니라 결측으로 처리한다.
  min_posts: 5
  include_comments: true

analyze:
  # 시차 상관 탐색 범위. k>0 이면 감성이 수익률보다 앞선 비교다.
  lag_range: [-5, 5]
  # 다중검정 보정 방법: bh(Benjamini-Hochberg) 또는 none
  multiple_testing: bh
  # Newey-West HAC 표준오차의 lag 수
  hac_maxlags: 5
  granger_maxlag: 5
  # 민감도 분석에 사용할 min_posts 후보
  sensitivity_min_posts: [1, 5, 10]

paths:
  data_dir: data
  output_dir: output
  runs_dir: runs
