<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 1000" width="736" height="1000" role="img" aria-labelledby="title desc"><title id="title">토스 커뮤니티 감성 분석: 처리 흐름과 검증 상태</title><desc id="desc">수집과 분석 실행 완료. 감성분류 사람 정답 검증은 미완료. AI 일치율은 정확도가 아니다.</desc><style>svg {background:#ffffff;color:#17212f;font-family:"Noto Sans CJK KR",sans-serif} text{fill:currentColor;font-size:16px}.muted{fill:#526173}.ok{fill:#087f8c}.pending{fill:#b76b06}@media(prefers-color-scheme:dark){svg{background:#151b23;color:#eef2f6}.muted{fill:#b4c0cc}.ok{fill:#5ecbd1}.pending{fill:#f5bc63}}</style><text x="24" y="36" style="font-size:24px;font-weight:600">수집·분석은 실행 완료, 감성 신뢰성은 검증 대기</text><text x="24" y="67" class="muted">2026-10-21 기준 · 69개 테스트 통과</text><path d="M 30 112 V 220" fill="none" stroke="currentColor" stroke-opacity=".3" /><path d="M 26 214 L 30 220 L 34 214" fill="none" stroke="currentColor" stroke-opacity=".5" /><circle cx="30" cy="112" r="5" class="ok" /><rect x="48" y="92" width="664" height="100" rx="8" class="ok" fill-opacity=".09" /><text x="64" y="117" class="">01 수집</text><text x="570" y="117" class="muted">완료</text><text x="64" y="145" class="">2종목 · 글·댓글 7,759건</text><text x="64" y="172" class="muted">기간: 2026.07.01–10.20</text><path d="M 30 228 V 336" fill="none" stroke="currentColor" stroke-opacity=".3" /><path d="M 26 330 L 30 336 L 34 330" fill="none" stroke="currentColor" stroke-opacity=".5" /><circle cx="30" cy="228" r="5" class="ok" /><rect x="48" y="208" width="664" height="100" rx="8" class="ok" fill-opacity=".09" /><text x="64" y="233" class="">02 정제</text><text x="570" y="233" class="muted">완료</text><text x="64" y="261" class="">멘션·중복·길이·기간 처리</text><text x="64" y="288" class="muted">분석용 텍스트 7,632건</text><path d="M 30 344 V 452" fill="none" stroke="currentColor" stroke-opacity=".3" /><path d="M 26 446 L 30 452 L 34 446" fill="none" stroke="currentColor" stroke-opacity=".5" /><circle cx="30" cy="344" r="5" class="pending" /><rect x="48" y="324" width="664" height="100" rx="8" class="pending" fill-opacity=".09" /><text x="64" y="349" class="">03 감성분류</text><text x="570" y="349" class="muted">검증 대기</text><text x="64" y="377" class="">사전으로 긍정·중립·부정</text><text x="64" y="404" class="muted">AI 300건과 일치 38%</text><path d="M 30 460 V 568" fill="none" stroke="currentColor" stroke-opacity=".3" /><path d="M 26 562 L 30 568 L 34 562" fill="none" stroke="currentColor" stroke-opacity=".5" /><circle cx="30" cy="460" r="5" class="ok" /><rect x="48" y="440" width="664" height="100" rx="8" class="ok" fill-opacity=".09" /><text x="64" y="465" class="">04 거래일 집계</text><text x="570" y="465" class="muted">완료</text><text x="64" y="493" class="">15:30 종가 기준으로 배정</text><text x="64" y="520" class="muted">일별 감성지수 산출</text><path d="M 30 576 V 684" fill="none" stroke="currentColor" stroke-opacity=".3" /><path d="M 26 678 L 30 684 L 34 678" fill="none" stroke="currentColor" stroke-opacity=".5" /><circle cx="30" cy="576" r="5" class="ok" /><rect x="48" y="556" width="664" height="100" rx="8" class="ok" fill-opacity=".09" /><text x="64" y="581" class="">05 시세 병합</text><text x="570" y="581" class="muted">완료</text><text x="64" y="609" class="">감성 + 주가·거래량·시장지수</text><text x="64" y="636" class="muted">2종목 × 74거래일 = 148행</text><path d="M 30 692 V 800" fill="none" stroke="currentColor" stroke-opacity=".3" /><path d="M 26 794 L 30 800 L 34 794" fill="none" stroke="currentColor" stroke-opacity=".5" /><circle cx="30" cy="692" r="5" class="pending" /><rect x="48" y="672" width="664" height="100" rx="8" class="pending" fill-opacity=".09" /><text x="64" y="697" class="">06 통계·예측</text><text x="570" y="697" class="muted">예비 결과</text><text x="64" y="725" class="">상관·회귀·순차 예측 실행</text><text x="64" y="752" class="muted">감성 추가 예측 개선 미확인</text><circle cx="30" cy="808" r="5" class="pending" /><rect x="48" y="788" width="664" height="100" rx="8" class="pending" fill-opacity=".09" /><text x="64" y="813" class="">07 다음 작업</text><text x="570" y="813" class="muted">미완료</text><text x="64" y="841" class="">사람 검수 → 분류 개선</text><text x="64" y="868" class="muted">별도 평가 표본 → 재분석</text><text x="24" y="936" class="muted">38%는 AI와 사전의 일치율이며, 사람 정답 기준 정확도가 아닙니다.</text><text x="24" y="964" class="muted">일별 감성지수 = (긍정 수 − 부정 수) / 전체 글·댓글 수</text></svg>